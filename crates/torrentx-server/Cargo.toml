[package]
name = "torrentx-server"
description = "TorrentX headless server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "torrentx-server"
path = "src/main.rs"

[dependencies]
torrentx-core = { workspace = true }
torrentx-rqbit = { workspace = true }
torrentx-transmission = { workspace = true }
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["multipart"] }
base64 = { workspace = true }
clap = { version = "4", features = ["derive"] }
directories = "6"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = "1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
maxminddb = "0.32.0"
open = "5.4.4"
percent-encoding = "2.3.2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[features]
# Embed the DB-IP country database (run scripts/fetch-geoip.sh first).
geoip = []
