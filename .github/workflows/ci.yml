name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Replaces Knope Bot's "Require changes to be documented": a PR needs a change file in .changeset/
  # (`knope document-change`) unless every commit is a conventional commit.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: knope-dev/action@v2.1.2
        with:
          version: 0.23.0
      - run: knope --validate
      - name: Change file or conventional commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "release" ]; then exit 0; fi
          if git diff --name-only --diff-filter=A "$BASE...$HEAD" -- .changeset | grep -q '\.md$'; then
            echo "Documented by a change file."; exit 0
          fi
          bad=$(git log --no-merges --format=%s "$BASE..$HEAD" \
            | grep -Ev '^(feat|fix|docs|ci|chore|build|test|refactor|perf|style)(\(.+\))?!?: ' || true)
          if [ -z "$bad" ]; then echo "Documented by conventional commits."; exit 0; fi
          echo "::error::Add a change file (run \`knope document-change\`) or use conventional commit messages. Not conventional:"
          echo "$bad"
          exit 1

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-embed needs the real UI in apps/web/dist.
      - run: pnpm build:web
      - run: cargo test --workspace
