# Builds and publishes binaries (modelled on 2fau-app's release workflow, with build and publish split):
# - push to main: if the commit's version has no tag yet (the Knope `release` PR was merged), `publish` runs
#   `knope release` (tags vX.Y.Z and publishes the GitHub release with the binaries attached); otherwise it replaces
#   the rolling `nightly` pre-release;
# - push of a v* tag, or workflow_dispatch with a tag: (re)build that release's binaries; re-runs replace assets.
# Build jobs run third-party code (pnpm install, cargo) with a read-only token; only `publish` can write.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "openspec/**"
      - ".changeset/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, e.g. v0.2.0
        required: true

# A release commit gets its own group so a later push can never cancel it; nightly builds supersede each other.
concurrency:
  group: "release-${{ contains(github.event.head_commit.message, 'chore: prepare release') && github.sha || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      label: ${{ steps.t.outputs.label }}
      version: ${{ steps.t.outputs.version }}
      ref: ${{ steps.t.outputs.ref }}
    env:
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - id: t
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$version" ]; then echo "no workspace version in Cargo.toml" >&2; exit 1; fi
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"
          elif ! git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/v$version" > /dev/null; then
            tag="v$version" # the release PR was merged: its version has no tag yet
          else tag=nightly
          fi
          if [ "$tag" != nightly ] && [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match Cargo.toml version $version" >&2; exit 1
          fi
          label=$([ "$tag" = nightly ] && echo nightly || echo "$version")
          { echo "tag=$tag"; echo "label=$label"; echo "version=$version"; echo "ref=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"
          echo "Building for $tag ($label)"

  desktop:
    name: desktop (${{ matrix.name }})
    needs: target
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: target/universal-apple-darwin/release/bundle
          - name: windows
            runner: windows-latest
            bundle: target/release/bundle
          - name: linux
            runner: ubuntu-22.04
            bundle: target/release/bundle
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.ref }}
          persist-credentials: false
      - name: Install Tauri system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop-${{ matrix.name }}
      - run: pnpm build:desktop:${{ matrix.name }}
        env:
          # Makes bundle_dmg.sh skip the Finder layout step, which hangs on headless runners.
          CI: "true"
      - name: Collect installers
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: |
          shopt -s nullglob
          mkdir -p out
          cp "$BUNDLE"/dmg/*.dmg "$BUNDLE"/msi/*.msi "$BUNDLE"/nsis/*.exe "$BUNDLE"/appimage/*.AppImage "$BUNDLE"/deb/*.deb out/
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  server:
    name: server (linux ${{ matrix.arch }})
    needs: target
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc floor at 2.35.
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: server-${{ matrix.arch }}
      - run: pnpm build:server
      - name: Package
        env:
          LABEL: ${{ needs.target.outputs.label }}
        run: |
          name="torrentx-server-${LABEL}-linux-${{ matrix.arch }}"
          mkdir -p "pkg/$name" out
          cp target/release/torrentx-server packaging/systemd/torrentx.service docs/linux-service.md "pkg/$name/"
          tar -C pkg -czf "out/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  # The only job with write access: no dependency installs or builds here.
  publish:
    needs: [target, desktop, server]
    if: always() && needs.target.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.target.outputs.tag }}
      VERSION: ${{ needs.target.outputs.version }}
      SHA: ${{ needs.target.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          # knope.toml `assets` points here.
          path: artifacts
          merge-multiple: true
      - name: Stable names and checksums
        working-directory: artifacts
        run: |
          if [ "$TAG" = nightly ]; then
            # Desktop bundles carry the app version; nightly assets say "nightly" instead.
            for f in *"_${VERSION}_"*; do [ -e "$f" ] && mv "$f" "${f/_${VERSION}_/_nightly_}"; done
          else
            # Stable names back the releases/latest/download/<name> links.
            copy() { for f in $1; do [ -e "$f" ] && cp "$f" "$2"; done; return 0; }
            copy "*_universal.dmg" TorrentX-macos-universal.dmg
            copy "*_x64_*.msi" TorrentX-windows-x64.msi
            copy "*_x64-setup.exe" TorrentX-windows-x64-setup.exe
            copy "*.AppImage" TorrentX-linux-x86_64.AppImage
            copy "*_amd64.deb" TorrentX-linux-amd64.deb
            copy "torrentx-server-*-linux-x86_64.tar.gz" torrentx-server-linux-x86_64.tar.gz
            copy "torrentx-server-*-linux-aarch64.tar.gz" torrentx-server-linux-aarch64.tar.gz
          fi
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        if: needs.target.outputs.tag != 'nightly'
        with:
          version: 0.23.0
      - name: Create or replace the release
        env:
          # The default token: a tag it creates does not start a second (tag-push) run.
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Every path creates the release as a draft, uploads, then publishes: it never appears half-empty.
          if [ "$TAG" = nightly ]; then
            # Delete + create so stale assets never linger and the tag moves to this commit.
            gh release delete nightly --cleanup-tag --yes || true
            gh release create nightly artifacts/* --target "$SHA" --prerelease --latest=false --title "Nightly" \
              --notes "Rolling build of \`main\` at ${SHA}. Unstable; unsigned. Prefer the latest versioned release."
          elif gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber -- artifacts/* # re-run: replace assets
          elif git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            gh release create "$TAG" artifacts/* --verify-tag --title "${TAG#v}" --notes "See CHANGELOG.md."
          else
            knope release --verbose # tags the version; draft, uploads artifacts/*, publishes with its changelog entry
          fi
      - name: Fail if a build failed
        if: needs.desktop.result != 'success' || needs.server.result != 'success'
        run: |
          echo "::error::desktop: ${{ needs.desktop.result }}, server: ${{ needs.server.result }}; the release is missing binaries"
          exit 1
