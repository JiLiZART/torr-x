# Builds and publishes binaries (modelled on 2fau-app's release workflow):
# - push to main: if the merged commit is a release (Knope `release` PR), `knope release` tags vX.Y.Z and creates the
#   GitHub release, and this same run attaches the binaries; otherwise the rolling `tip` pre-release is rebuilt;
# - push of a v* tag, or workflow_dispatch with a tag: (re)build that release's binaries; re-runs replace assets.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "openspec/**"
      - ".changeset/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, e.g. v0.2.0
        required: true

# A release commit gets its own group so a later push can never cancel it; tip builds supersede each other.
concurrency:
  group: "release-${{ contains(github.event.head_commit.message, 'chore: prepare release') && github.sha || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      label: ${{ steps.t.outputs.label }}
      ref: ${{ steps.t.outputs.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Created with the default token, so the tag does not start a second (tag-push) run.
      GITHUB_TOKEN: ${{ github.token }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        if: github.ref == 'refs/heads/main'
        with:
          version: 0.23.0
      - id: t
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$version" ]; then echo "no workspace version in Cargo.toml" >&2; exit 1; fi
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"
          elif ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            # The release PR was merged: its version has no tag yet.
            knope release --verbose
            tag="v$version"
          else tag=tip
          fi
          if [ "$tag" != tip ] && [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match Cargo.toml version $version" >&2; exit 1
          fi
          label=$([ "$tag" = tip ] && echo tip || echo "$version")
          { echo "tag=$tag"; echo "label=$label"; echo "ref=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"
          echo "Publishing to $tag ($label)"
      - name: Prepare the release
        env:
          TAG: ${{ steps.t.outputs.tag }}
          SHA: ${{ steps.t.outputs.ref }}
        run: |
          if [ "$TAG" = tip ]; then
            # Delete + create so stale assets never linger and the tag moves to this commit.
            gh release delete tip --cleanup-tag --yes || true
            gh release create tip --target "$SHA" --prerelease --latest=false --title "Tip" \
              --notes "Rolling build of \`main\` at ${SHA}. Unstable; unsigned. Prefer the latest versioned release."
          elif ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "${TAG#v}" --notes "See CHANGELOG.md."
          fi

  desktop:
    name: desktop (${{ matrix.name }})
    needs: target
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Keep `args` in sync with the build:desktop:* scripts in package.json.
        include:
          - name: macos
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --features geoip --target universal-apple-darwin
          - name: windows
            runner: windows-latest
            args: --features geoip --bundles msi,nsis
          - name: linux
            runner: ubuntu-22.04
            args: --features geoip --bundles appimage,deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.ref }}
      - name: Install Tauri system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop-${{ matrix.name }}
      - run: pnpm build:web
      - run: pnpm fetch:geoip
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Makes bundle_dmg.sh skip the Finder layout step, which hangs on headless runners.
          CI: "true"
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.target.outputs.tag }}
          releaseDraft: false
          prerelease: ${{ needs.target.outputs.tag == 'tip' }}
          args: ${{ matrix.args }}

  server:
    name: server (linux ${{ matrix.arch }})
    needs: target
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc floor at 2.35.
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: server-${{ matrix.arch }}
      - run: pnpm build:server
      - name: Package and upload
        env:
          LABEL: ${{ needs.target.outputs.label }}
          TAG: ${{ needs.target.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          name="torrentx-server-${LABEL}-linux-${{ matrix.arch }}"
          mkdir -p "pkg/$name" out
          cp target/release/torrentx-server packaging/systemd/torrentx.service docs/linux-service.md "pkg/$name/"
          tar -C pkg -czf "out/$name.tar.gz" "$name"
          gh release upload "$TAG" "out/$name.tar.gz" --clobber

  finalize:
    needs: [target, desktop, server]
    if: always() && needs.target.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.target.outputs.tag }}
    steps:
      - name: Stable names and checksums
        run: |
          mkdir out && cd out
          gh release download "$TAG" --skip-existing
          rm -f SHA256SUMS.txt
          if [ "$TAG" != tip ]; then
            # Stable names back the releases/latest/download/<name> links.
            copy() { for f in $1; do [ -e "$f" ] && cp "$f" "$2"; done; return 0; }
            copy "*_universal.dmg" TorrentX-macos-universal.dmg
            copy "*_x64_*.msi" TorrentX-windows-x64.msi
            copy "*_x64-setup.exe" TorrentX-windows-x64-setup.exe
            copy "*.AppImage" TorrentX-linux-x86_64.AppImage
            copy "*_amd64.deb" TorrentX-linux-amd64.deb
            copy "torrentx-server-*-linux-x86_64.tar.gz" torrentx-server-linux-x86_64.tar.gz
            copy "torrentx-server-*-linux-aarch64.tar.gz" torrentx-server-linux-aarch64.tar.gz
          fi
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" --clobber -- *
      - name: Fail if a build failed
        if: needs.desktop.result != 'success' || needs.server.result != 'success'
        run: |
          echo "::error::desktop: ${{ needs.desktop.result }}, server: ${{ needs.server.result }}; the release is missing binaries"
          exit 1
