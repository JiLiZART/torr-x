[package]
name = "torrentx-desktop"
description = "TorrentX desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows (cargo#8519).
name = "torrentx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
torrentx-server = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
reqwest = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tokio.workspace = true

[features]
# Embed the GeoIP database (see scripts/fetch-geoip.sh).
geoip = ["torrentx-server/geoip"]
